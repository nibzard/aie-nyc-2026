<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 720" role="img" aria-labelledby="title desc">
  <title id="title">Compute becomes a market</title>
  <desc id="desc">Concept map of the compute supply chain. Four stations run left to right: chips (GPU supply), power, credit, and contracts. Credit is marked as the binding constraint and carries the quote "You hit credit way before you hit power." A text progression shows the deposit needed to start a lab climbing from $10 million to $100 million to $1 billion in three years. A contrast panel compares unlit over-the-counter deals done over chat, with 15 to 25 percent prepayment on a $100 million cluster, against a neutral exchange whose term curve flipped to contango and where CME will settle H100 and B200 futures on Silicon Data indices, across 100+ verified providers and 80,000+ GPUs in supply.</desc>
  <g font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
    <!-- Card -->
    <rect x="0.5" y="0.5" width="959" height="719" rx="12" fill="#fcfcfb" stroke="rgba(11,11,11,0.10)" stroke-width="1"/>

    <!-- Header -->
    <text x="48" y="66" font-size="11" letter-spacing="0.08em" fill="#52514e">CONCEPT — COMPUTE MARKETS</text>
    <text x="48" y="94" font-size="20" font-weight="600" fill="#0b0b0b">Compute becomes a market</text>
    <text x="48" y="120" font-size="13" fill="#52514e">Credit, not power, is the number-one bottleneck of AI.</text>

    <!-- Binding-constraint chip above the credit station -->
    <rect x="513" y="130" width="161" height="21" rx="10.5" fill="#2a78d6"/>
    <text x="593.5" y="145" font-size="11" font-weight="600" letter-spacing="0.05em" fill="#fcfcfb" text-anchor="middle">BINDING CONSTRAINT</text>

    <!-- Supply-chain stations -->
    <rect x="48" y="162" width="183" height="74" rx="8" fill="#ffffff" stroke="#c3c2b7" stroke-width="1"/>
    <rect x="275" y="162" width="183" height="74" rx="8" fill="#ffffff" stroke="#c3c2b7" stroke-width="1"/>
    <rect x="502" y="162" width="183" height="74" rx="8" fill="#2a78d6" fill-opacity="0.08" stroke="#2a78d6" stroke-width="1.5"/>
    <rect x="729" y="162" width="183" height="74" rx="8" fill="#ffffff" stroke="#c3c2b7" stroke-width="1"/>

    <text x="139.5" y="196" font-size="13" font-weight="600" fill="#0b0b0b" text-anchor="middle">Chips</text>
    <text x="139.5" y="216" font-size="11" fill="#52514e" text-anchor="middle">GPU supply</text>
    <text x="366.5" y="196" font-size="13" font-weight="600" fill="#0b0b0b" text-anchor="middle">Power</text>
    <text x="366.5" y="216" font-size="11" fill="#52514e" text-anchor="middle">grid, buildings, land</text>
    <text x="593.5" y="196" font-size="13" font-weight="600" fill="#0b0b0b" text-anchor="middle">Credit</text>
    <text x="593.5" y="216" font-size="11" fill="#52514e" text-anchor="middle">cash in the bank</text>
    <text x="820.5" y="196" font-size="13" font-weight="600" fill="#0b0b0b" text-anchor="middle">Contracts</text>
    <text x="820.5" y="216" font-size="11" fill="#52514e" text-anchor="middle">the market layer</text>

    <!-- Flow arrows -->
    <g stroke="#52514e" stroke-width="1.5" stroke-linecap="round" fill="#52514e">
      <line x1="236" y1="199" x2="264" y2="199"/>
      <path d="M263,194 L272,199 L263,204 Z" stroke="none"/>
      <line x1="463" y1="199" x2="491" y2="199"/>
      <path d="M490,194 L499,199 L490,204 Z" stroke="none"/>
      <line x1="690" y1="199" x2="718" y2="199"/>
      <path d="M717,194 L726,199 L717,204 Z" stroke="none"/>
    </g>

    <!-- Quote callout under the credit station -->
    <line x1="593.5" y1="236" x2="593.5" y2="258" stroke="#c3c2b7" stroke-width="1"/>
    <rect x="408" y="258" width="372" height="64" rx="8" fill="#ffffff" stroke="#c3c2b7" stroke-width="1"/>
    <text x="424" y="284" font-size="13" fill="#0b0b0b">“You hit credit way before you hit power.”</text>
    <text x="424" y="306" font-size="11" fill="#52514e">Evan Conrad, San Francisco Compute</text>

    <!-- Left panel: the deposit ladder -->
    <rect x="48" y="352" width="396" height="244" rx="8" fill="#ffffff" stroke="#c3c2b7" stroke-width="1"/>
    <text x="68" y="384" font-size="13" font-weight="600" fill="#0b0b0b">Deposit to start a lab</text>
    <text x="68" y="402" font-size="11" fill="#52514e">three years, 10x per step</text>

    <!-- Equal cards show a sequence, not a quantitative bar scale. -->
    <rect x="68" y="440" width="100" height="72" rx="8" fill="#2a78d6" fill-opacity="0.08"/>
    <rect x="196" y="440" width="100" height="72" rx="8" fill="#2a78d6" fill-opacity="0.08"/>
    <rect x="324" y="440" width="100" height="72" rx="8" fill="#2a78d6" fill-opacity="0.08"/>
    <text x="118" y="482" font-size="20" font-weight="600" fill="#0b0b0b" text-anchor="middle">$10M</text>
    <text x="246" y="482" font-size="20" font-weight="600" fill="#0b0b0b" text-anchor="middle">$100M</text>
    <text x="374" y="482" font-size="20" font-weight="600" fill="#0b0b0b" text-anchor="middle">$1B</text>
    <path d="M176,476 H188 M183,471 L188,476 L183,481 M304,476 H316 M311,471 L316,476 L311,481" fill="none" stroke="#52514e" stroke-width="1.5"/>
    <text x="118" y="536" font-size="11" fill="#52514e" text-anchor="middle">then</text>
    <text x="374" y="536" font-size="11" fill="#52514e" text-anchor="middle">now</text>
    <text x="68" y="580" font-size="11" fill="#52514e">Lenders cannot underwrite AGI, so the deposit climbs.</text>

    <!-- Right panel: the contracts layer -->
    <rect x="472" y="352" width="440" height="244" rx="8" fill="#ffffff" stroke="#c3c2b7" stroke-width="1"/>
    <text x="492" y="384" font-size="13" font-weight="600" fill="#0b0b0b">The contracts layer</text>
    <text x="492" y="402" font-size="11" fill="#52514e">over-the-counter means unlit and bilateral</text>

    <rect x="492" y="414" width="172" height="128" rx="8" fill="#fcfcfb" stroke="#c3c2b7" stroke-width="1"/>
    <text x="578" y="436" font-size="11" font-weight="600" letter-spacing="0.04em" fill="#0b0b0b" text-anchor="middle">UNLIT OTC</text>
    <text x="578" y="455" font-size="11" fill="#52514e" text-anchor="middle"><tspan x="578">Deals done over Slack,</tspan><tspan x="578" dy="16">X, Telegram group chats</tspan><tspan x="578" dy="32">15–25% prepayment on</tspan><tspan x="578" dy="16">a $100M cluster</tspan><tspan x="578" dy="16">(CoreWeave median)</tspan></text>

    <rect x="720" y="414" width="172" height="128" rx="8" fill="#fcfcfb" stroke="#c3c2b7" stroke-width="1"/>
    <text x="806" y="436" font-size="11" font-weight="600" letter-spacing="0.04em" fill="#0b0b0b" text-anchor="middle">NEUTRAL EXCHANGE</text>
    <text x="806" y="455" font-size="11" fill="#52514e" text-anchor="middle"><tspan x="806">Term curve flipped to</tspan><tspan x="806" dy="16">contango</tspan><tspan x="806" dy="32">CME to settle H100 and</tspan><tspan x="806" dy="16">B200 futures on Silicon</tspan><tspan x="806" dy="16">Data indices (in weeks)</tspan></text>

    <g stroke="#52514e" stroke-width="1.5" stroke-linecap="round" fill="#52514e">
      <line x1="670" y1="478" x2="712" y2="478"/>
      <path d="M711,473 L720,478 L711,483 Z" stroke="none"/>
    </g>

    <rect x="492" y="556" width="190" height="24" rx="12" fill="#2a78d6" fill-opacity="0.10"/>
    <text x="587" y="572" font-size="11" fill="#0b0b0b" text-anchor="middle">100+ verified providers</text>
    <rect x="698" y="556" width="194" height="24" rx="12" fill="#2a78d6" fill-opacity="0.10"/>
    <text x="795" y="572" font-size="11" fill="#0b0b0b" text-anchor="middle">80,000+ GPUs in supply</text>

    <!-- Sources -->
    <text x="48" y="640" font-size="11" fill="#52514e">Source: Evan Conrad (San Francisco Compute), “How Compute Markets Work”, AI Engineer NYC 2026, day 2.</text>
    <text x="48" y="656" font-size="11" fill="#52514e">Source: Affaan Mustafa and Alejandro Soumah Fernandez (Jump Trading), “The Dark Pools of Compute”, AI Engineer NYC 2026, day 2.</text>
    <text x="48" y="672" font-size="11" fill="#52514e">Source: Carmen Li (Compute Exchange; Silicon Data), “CEO, Compute Exchange”, AI Engineer NYC 2026, day 2.</text>
  </g>
</svg>
