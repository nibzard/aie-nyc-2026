<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 720" role="img" aria-labelledby="title desc">
  <title id="title">Build the loop, not the feature</title>
  <desc id="desc">Two panels. Top: the old job — a linear request, build, ship pipeline that terminates. Below: the always-on agent loop — trigger on cadence, event, or metric; a sandbox loaded with context behind a single proxy; sweep telemetry; open fixes; save issues and skills to memory; teardown credentials; durable resume from a failed step. A footer strip shows the abstraction ladder from higher-level languages to factories of agents.</desc>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#52514e"/>
    </marker>
  </defs>
  <rect x="0.5" y="0.5" width="959" height="719" rx="12" fill="#fcfcfb" stroke="rgba(11,11,11,0.10)" stroke-width="1"/>
  <text x="48" y="64" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="11" letter-spacing="0.08em" fill="#52514e">CONCEPT — THE LOOP</text>
  <text x="48" y="90" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="20" font-weight="600" fill="#0b0b0b">Build the loop, not the feature</text>
  <text x="48" y="114" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="13" fill="#52514e">"As an AI engineer, your job is no longer to just write the feature, write an AI feature."</text>

  <g font-family="system-ui, -apple-system, &apos;Segoe UI&apos;, sans-serif">
<rect x="48" y="140" width="864" height="80" rx="8" fill="#ffffff" stroke="#c3c2b7"/>
<text x="68" y="165" font-size="12" fill="#0b0b0b" font-weight="600">then — write the feature</text>
<rect x="350" y="160" width="120" height="36" rx="8" fill="#fcfcfb" stroke="#c3c2b7"/>
<text x="410" y="183" font-size="12" fill="#0b0b0b" font-weight="600" text-anchor="middle">request</text>
<path d="M470,178 H500" stroke="#52514e" stroke-width="1.5" marker-end="url(#arr)"/>
<rect x="508" y="160" width="120" height="36" rx="8" fill="#fcfcfb" stroke="#c3c2b7"/>
<text x="568" y="183" font-size="12" fill="#0b0b0b" font-weight="600" text-anchor="middle">build</text>
<path d="M628,178 H658" stroke="#52514e" stroke-width="1.5" marker-end="url(#arr)"/>
<rect x="666" y="160" width="120" height="36" rx="8" fill="#fcfcfb" stroke="#c3c2b7"/>
<text x="726" y="183" font-size="12" fill="#0b0b0b" font-weight="600" text-anchor="middle">ship</text>
<text x="68" y="192" font-size="11" fill="#52514e">Review the diff; read dashboards.</text>
<text x="850" y="183" font-size="11" fill="#52514e">ends</text>
<rect x="48" y="242" width="864" height="324" rx="8" fill="#ffffff" stroke="#2a78d6" stroke-width="1.5"/>
<text x="68" y="270" font-size="13" fill="#0b0b0b" font-weight="600">now — build the loop</text>
<text x="68" y="290" font-size="11" fill="#52514e">Arize Signal, always on</text>
<circle cx="166" cy="416" r="82" fill="none" stroke="#c3c2b7" stroke-width="2"/>
<text x="166" y="420" font-size="13" fill="#0b0b0b" font-weight="600" text-anchor="middle">always on</text>
<circle cx="166.0" cy="334.0" r="11" fill="#2a78d6"/>
<text x="166.0" y="338.0" font-size="11" fill="#ffffff" font-weight="600" text-anchor="middle">1</text>
<path d="M195.3,339.1 L204.3,343.4" stroke="#52514e" stroke-width="1.5" marker-end="url(#arr)"/>
<circle cx="230.1" cy="364.9" r="11" fill="#2a78d6"/>
<text x="230.1" y="368.9" font-size="11" fill="#ffffff" font-weight="600" text-anchor="middle">2</text>
<path d="M244.4,390.9 L246.6,400.7" stroke="#52514e" stroke-width="1.5" marker-end="url(#arr)"/>
<circle cx="245.9" cy="434.2" r="11" fill="#2a78d6"/>
<text x="245.9" y="438.2" font-size="11" fill="#ffffff" font-weight="600" text-anchor="middle">3</text>
<path d="M234.5,461.7 L228.2,469.5" stroke="#52514e" stroke-width="1.5" marker-end="url(#arr)"/>
<circle cx="201.6" cy="489.9" r="11" fill="#2a78d6"/>
<text x="201.6" y="493.9" font-size="11" fill="#ffffff" font-weight="600" text-anchor="middle">4</text>
<path d="M173.0,498.0 L163.0,498.0" stroke="#52514e" stroke-width="1.5" marker-end="url(#arr)"/>
<circle cx="130.4" cy="489.9" r="11" fill="#2a78d6"/>
<text x="130.4" y="493.9" font-size="11" fill="#ffffff" font-weight="600" text-anchor="middle">5</text>
<path d="M106.3,472.6 L100.0,464.8" stroke="#52514e" stroke-width="1.5" marker-end="url(#arr)"/>
<circle cx="86.1" cy="434.2" r="11" fill="#2a78d6"/>
<text x="86.1" y="438.2" font-size="11" fill="#ffffff" font-weight="600" text-anchor="middle">6</text>
<path d="M84.5,404.6 L86.7,394.8" stroke="#52514e" stroke-width="1.5" marker-end="url(#arr)"/>
<circle cx="101.9" cy="364.9" r="11" fill="#2a78d6"/>
<text x="101.9" y="368.9" font-size="11" fill="#ffffff" font-weight="600" text-anchor="middle">7</text>
<path d="M124.1,345.2 L133.1,340.8" stroke="#52514e" stroke-width="1.5" marker-end="url(#arr)"/>
<circle cx="320" cy="266" r="9" fill="#2a78d6"/>
<text x="320" y="270" font-size="11" fill="#ffffff" font-weight="600" text-anchor="middle">1</text>
<text x="340" y="270" font-size="12" fill="#0b0b0b" font-weight="600">Trigger</text>
<text x="340" y="287" font-size="11" fill="#52514e">Every 3 or 6 hours, on events, or at metric thresholds.</text>
<circle cx="320" cy="308" r="9" fill="#2a78d6"/>
<text x="320" y="312" font-size="11" fill="#ffffff" font-weight="600" text-anchor="middle">2</text>
<text x="340" y="312" font-size="12" fill="#0b0b0b" font-weight="600">Load the sandbox</text>
<text x="340" y="329" font-size="11" fill="#52514e">Traces, telemetry, repo access, and keys; one proxy in and out.</text>
<circle cx="320" cy="350" r="9" fill="#2a78d6"/>
<text x="320" y="354" font-size="11" fill="#ffffff" font-weight="600" text-anchor="middle">3</text>
<text x="340" y="354" font-size="12" fill="#0b0b0b" font-weight="600">Sweep telemetry</text>
<text x="340" y="371" font-size="11" fill="#52514e">Read traces, identify issues, and remember earlier findings.</text>
<circle cx="320" cy="392" r="9" fill="#2a78d6"/>
<text x="320" y="396" font-size="11" fill="#ffffff" font-weight="600" text-anchor="middle">4</text>
<text x="340" y="396" font-size="12" fill="#0b0b0b" font-weight="600">Open fixes</text>
<text x="340" y="413" font-size="11" fill="#52514e">Open a fix or a pull request when repo access is available.</text>
<circle cx="320" cy="434" r="9" fill="#2a78d6"/>
<text x="320" y="438" font-size="11" fill="#ffffff" font-weight="600" text-anchor="middle">5</text>
<text x="340" y="438" font-size="12" fill="#0b0b0b" font-weight="600">Save to memory</text>
<text x="340" y="455" font-size="11" fill="#52514e">Keep issues and learned skills for the next run.</text>
<circle cx="320" cy="476" r="9" fill="#2a78d6"/>
<text x="320" y="480" font-size="11" fill="#ffffff" font-weight="600" text-anchor="middle">6</text>
<text x="340" y="480" font-size="12" fill="#0b0b0b" font-weight="600">Tear down</text>
<text x="340" y="497" font-size="11" fill="#52514e">Remove the sandbox, credentials, and repo access.</text>
<circle cx="320" cy="518" r="9" fill="#2a78d6"/>
<text x="320" y="522" font-size="11" fill="#ffffff" font-weight="600" text-anchor="middle">7</text>
<text x="340" y="522" font-size="12" fill="#0b0b0b" font-weight="600">Resume after failure</text>
<text x="340" y="539" font-size="11" fill="#52514e">Continue from the failed step, with state saved outside the sandbox.</text>
</g>
  <!-- footer: quote and abstraction ladder -->
  <text x="48" y="586" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12" font-weight="600" fill="#0b0b0b">The abstraction ladder</text>
  <rect x="48" y="600" width="160" height="48" rx="8" fill="#ffffff" stroke="#c3c2b7" stroke-width="1"/>
  <text x="128" y="628" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12" font-weight="600" fill="#0b0b0b"><tspan x="128" dy="0">higher-level</tspan><tspan x="128" dy="15">languages</tspan></text>
  <line x1="208" y1="624" x2="226" y2="624" stroke="#52514e" stroke-width="1.5" marker-end="url(#arr)"/>
  <rect x="232" y="600" width="160" height="48" rx="8" fill="#ffffff" stroke="#c3c2b7" stroke-width="1"/>
  <text x="312" y="628" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12" font-weight="600" fill="#0b0b0b"><tspan x="312" dy="0">copy-pasting</tspan><tspan x="312" dy="15">code</tspan></text>
  <line x1="392" y1="624" x2="410" y2="624" stroke="#52514e" stroke-width="1.5" marker-end="url(#arr)"/>
  <rect x="416" y="600" width="160" height="48" rx="8" fill="#ffffff" stroke="#c3c2b7" stroke-width="1"/>
  <text x="496" y="630" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12" font-weight="600" fill="#0b0b0b">local agents</text>
  <line x1="576" y1="624" x2="594" y2="624" stroke="#52514e" stroke-width="1.5" marker-end="url(#arr)"/>
  <rect x="600" y="600" width="160" height="48" rx="8" fill="#ffffff" stroke="#c3c2b7" stroke-width="1"/>
  <text x="680" y="630" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12" font-weight="600" fill="#0b0b0b">cloud agents</text>
  <line x1="760" y1="624" x2="778" y2="624" stroke="#52514e" stroke-width="1.5" marker-end="url(#arr)"/>
  <rect x="784" y="600" width="128" height="48" rx="8" fill="#2a78d6" fill-opacity="0.10" stroke="#2a78d6" stroke-width="1.5"/>
  <text x="848" y="628" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12" font-weight="600" fill="#0b0b0b"><tspan x="848" dy="0">factories of</tspan><tspan x="848" dy="15">agents</tspan></text>

  <text x="48" y="680" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="11" fill="#52514e">Source: Aparna Dhinakaran (Arize AI), "What does an AI engineer do?", AI Engineer NYC 2026, day 1.</text>
</svg>
