<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="title desc" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
  <title id="title">Per-step accuracy compounds down</title>
  <desc id="desc">A single blue line chart of 0.95 to the power n for n from 1 to 20, falling from 95 percent at step 1 to about 36 percent at step 20. Markers sit at both ends; the endpoint is annotated "95% per step becomes about 36% by step 20". Side chips note 91 percent code-translation accuracy at 10,000 lines collapsing by 50,000, and LLM-judge verdicts changing 7 to 17 percent across identical re-asks.</desc>
  <rect x="1" y="1" width="958" height="538" rx="12" fill="#fcfcfb" stroke="rgba(11,11,11,0.10)" stroke-width="1"/>

  <!-- Header -->
  <text x="48" y="64" font-size="11" font-weight="600" letter-spacing="0.88" fill="#52514e">DATA — RELIABILITY</text>
  <text x="48" y="92" font-size="20" font-weight="600" fill="#0b0b0b">Per-step accuracy compounds down</text>
  <text x="48" y="116" font-size="13" fill="#52514e">At 95% accuracy per step, a 20-step task ends at 36% accuracy — each step multiplies the chain by 0.95.</text>

  <!-- Grid -->
  <line x1="120" y1="150" x2="880" y2="150" stroke="#e1e0d9" stroke-width="1"/>
  <line x1="120" y1="222.5" x2="880" y2="222.5" stroke="#e1e0d9" stroke-width="1"/>
  <line x1="120" y1="295" x2="880" y2="295" stroke="#e1e0d9" stroke-width="1"/>
  <line x1="120" y1="367.5" x2="880" y2="367.5" stroke="#e1e0d9" stroke-width="1"/>
  <line x1="120" y1="440" x2="880" y2="440" stroke="#c3c2b7" stroke-width="1"/>

  <!-- Axis labels -->
  <text x="108" y="154" font-size="11" fill="#52514e" text-anchor="end">100%</text>
  <text x="108" y="226.5" font-size="11" fill="#52514e" text-anchor="end">75%</text>
  <text x="108" y="299" font-size="11" fill="#52514e" text-anchor="end">50%</text>
  <text x="108" y="371.5" font-size="11" fill="#52514e" text-anchor="end">25%</text>
  <text x="108" y="444" font-size="11" fill="#52514e" text-anchor="end">0</text>
  <text x="120" y="136" font-size="11" fill="#52514e">chance all n steps are correct</text>
  <text x="120" y="462" font-size="11" fill="#52514e" text-anchor="middle">1</text>
  <text x="280" y="462" font-size="11" fill="#52514e" text-anchor="middle">5</text>
  <text x="480" y="462" font-size="11" fill="#52514e" text-anchor="middle">10</text>
  <text x="680" y="462" font-size="11" fill="#52514e" text-anchor="middle">15</text>
  <text x="880" y="462" font-size="11" fill="#52514e" text-anchor="middle">20</text>

  <!-- Curve: y = 0.95^n -->
  <polyline fill="none" stroke="#2a78d6" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
    points="120,164.5 160,178.3 200,191.4 240,203.8 280,215.6 320,226.8 360,237.5 400,247.6 440,257.2 480,266.4 520,275.0 560,283.3 600,291.1 640,298.6 680,305.6 720,312.4 760,318.7 800,324.8 840,330.6 880,336.0"/>

  <!-- Markers -->
  <circle cx="120" cy="164.5" r="4" fill="#2a78d6" stroke="#fcfcfb" stroke-width="2"/>
  <circle cx="880" cy="336" r="4" fill="#2a78d6" stroke="#fcfcfb" stroke-width="2"/>
  <text x="134" y="169" font-size="13" font-weight="600" fill="#0b0b0b">95%</text>
  <text x="872" y="378" font-size="13" font-weight="600" fill="#0b0b0b" text-anchor="end">95% per step → about 36% by step 20</text>

  <!-- Chips -->
  <rect x="640" y="158" width="240" height="60" rx="8" fill="#ffffff" stroke="#e1e0d9" stroke-width="1"/>
  <text x="654" y="180" font-size="13" font-weight="600" fill="#0b0b0b">91% at 10K lines</text>
  <text x="654" y="198" font-size="11" fill="#52514e">code-translation accuracy</text>
  <text x="654" y="212" font-size="11" fill="#52514e">collapses by 50K lines</text>

  <rect x="640" y="228" width="240" height="60" rx="8" fill="#ffffff" stroke="#e1e0d9" stroke-width="1"/>
  <text x="654" y="250" font-size="13" font-weight="600" fill="#0b0b0b">7–17%</text>
  <text x="654" y="268" font-size="11" fill="#52514e">of LLM-judge verdicts change</text>
  <text x="654" y="282" font-size="11" fill="#52514e">across identical re-asks</text>

  <!-- Note and source -->
  <text x="48" y="482" font-size="11" fill="#52514e">Curve computed as 0.95 to the n; the 95% and 36% figures are from the talk.</text>
  <text x="48" y="500" font-size="11" fill="#52514e">Source: Tariq Shaukat (Sonar), “The Machine that Changed the World, vAI”, AI Engineer NYC 2026, day 2.</text>
</svg>
