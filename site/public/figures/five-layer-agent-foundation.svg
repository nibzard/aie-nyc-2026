<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 720" role="img" aria-labelledby="title desc">
  <title id="title">The five-layer agent foundation</title>
  <desc id="desc">A five-layer stack, walked bottom-up in the talk: connectors via MCP, skills, identity and permissions, approval, and evals. Each layer carries its one-line role and detail; a side chip gives the worked example of the trade break investigation agent, and a footer strip shows the industry arc from 2023 chatbots to the coming age of scale.</desc>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#52514e"/>
    </marker>
  </defs>
  <rect x="0.5" y="0.5" width="959" height="719" rx="12" fill="#fcfcfb" stroke="rgba(11,11,11,0.10)" stroke-width="1"/>
  <text x="48" y="64" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="11" letter-spacing="0.08em" fill="#52514e">CONCEPT — ARCHITECTURE</text>
  <text x="48" y="90" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="20" font-weight="600" fill="#0b0b0b">The five-layer agent foundation</text>
  <text x="48" y="114" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="13" fill="#52514e">"And our opportunity here to scale is not the model. Our opportunity here</text>
  <text x="48" y="132" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="13" fill="#52514e">to scale is building the foundation for agents that can go from one to many."</text>

  <!-- layer 5 (top) -->
  <rect x="64" y="156" width="248" height="52" rx="8" fill="#104281"/>
  <circle cx="92" cy="182" r="11" fill="none" stroke="#ffffff" stroke-width="1.5"/>
  <text x="92" y="186" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12" font-weight="600" fill="#ffffff">5</text>
  <text x="114" y="186" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="13" font-weight="600" fill="#ffffff">evals</text>
  <text x="336" y="180" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12" font-weight="600" fill="#0b0b0b">how you know it still works over time</text>
  <text x="336" y="196" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="11" fill="#52514e">SME-defined test cases against a baseline — every change to a</text>
  <text x="336" y="210" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="11" fill="#52514e">model or skill shows up as improvement or regression</text>

  <!-- layer 4 -->
  <rect x="64" y="212" width="248" height="52" rx="8" fill="#1c5cab"/>
  <circle cx="92" cy="238" r="11" fill="none" stroke="#ffffff" stroke-width="1.5"/>
  <text x="92" y="242" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12" font-weight="600" fill="#ffffff">4</text>
  <text x="114" y="242" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="13" font-weight="600" fill="#ffffff">approval</text>
  <text x="336" y="236" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12" font-weight="600" fill="#0b0b0b">who signs off before the agent acts</text>
  <text x="336" y="252" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="11" fill="#52514e">a human signs off, with deterministic guardrails called hooks</text>

  <!-- layer 3 -->
  <rect x="64" y="268" width="248" height="52" rx="8" fill="#2a78d6"/>
  <circle cx="92" cy="294" r="11" fill="none" stroke="#ffffff" stroke-width="1.5"/>
  <text x="92" y="298" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12" font-weight="600" fill="#ffffff">3</text>
  <text x="114" y="298" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="13" font-weight="600" fill="#ffffff">identity and permissions</text>
  <text x="336" y="292" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12" font-weight="600" fill="#0b0b0b">who the agent is acting as</text>
  <text x="336" y="308" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="11" fill="#52514e">role: ops analyst — can read order and market data, denied CRM on purpose;</text>
  <text x="336" y="322" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="11" fill="#52514e">proposes amendments; it never makes them</text>

  <!-- layer 2 -->
  <rect x="64" y="324" width="248" height="52" rx="8" fill="#5598e7"/>
  <circle cx="92" cy="350" r="11" fill="none" stroke="#0b0b0b" stroke-width="1.5"/>
  <text x="92" y="354" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12" font-weight="600" fill="#0b0b0b">2</text>
  <text x="114" y="354" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="13" font-weight="600" fill="#0b0b0b">skills</text>
  <text x="336" y="348" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12" font-weight="600" fill="#0b0b0b">context for business rules and processes</text>
  <text x="336" y="364" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="11" fill="#52514e">"living, breathing, versioned code" — plain text, updated frequently,</text>
  <text x="336" y="378" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="11" fill="#52514e">written by the SMEs who do the work</text>

  <!-- layer 1 (bottom) -->
  <rect x="64" y="380" width="248" height="52" rx="8" fill="#86b6ef"/>
  <circle cx="92" cy="406" r="11" fill="none" stroke="#0b0b0b" stroke-width="1.5"/>
  <text x="92" y="410" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12" font-weight="600" fill="#0b0b0b">1</text>
  <text x="114" y="410" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="13" font-weight="600" fill="#0b0b0b">connectors (MCP)</text>
  <text x="336" y="404" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12" font-weight="600" fill="#0b0b0b">context for systems and data</text>
  <text x="336" y="420" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="11" fill="#52514e">one secure connectivity layer (MCP) instead of hand-wired integrations;</text>
  <text x="336" y="434" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="11" fill="#52514e">5 agents wired to 5 systems means 25 to maintain and manage</text>

  <text x="64" y="452" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="11" fill="#52514e">the talk walks the stack bottom-up, starting with connectors</text>

  <!-- worked example chip -->
  <rect x="64" y="470" width="848" height="70" rx="8" fill="#2a78d6" fill-opacity="0.08" stroke="#c3c2b7" stroke-width="1"/>
  <text x="80" y="492" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12" font-weight="600" fill="#0b0b0b">Worked example — the trade break investigation agent</text>
  <text x="80" y="510" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="11" fill="#52514e">two records of a single trade don't match. The agent investigates and proposes a booking amendment —</text>
  <text x="80" y="524" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="11" fill="#52514e">an SME in the loop approves before the change is applied; hooks keep the agent inside its confines.</text>

  <!-- industry arc -->
  <text x="64" y="570" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12" font-weight="600" fill="#0b0b0b">The industry arc</text>
  <text x="912" y="570" text-anchor="end" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="11" fill="#52514e">hand-wiring does not scale</text>
  <rect x="64" y="584" width="140" height="44" rx="8" fill="#ffffff" stroke="#c3c2b7" stroke-width="1"/>
  <text x="76" y="600" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="11" fill="#52514e">2023</text>
  <text x="76" y="618" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12" font-weight="600" fill="#0b0b0b">chatbots</text>
  <line x1="204" y1="606" x2="218" y2="606" stroke="#52514e" stroke-width="1.5" marker-end="url(#arr)"/>
  <rect x="222" y="584" width="190" height="44" rx="8" fill="#ffffff" stroke="#c3c2b7" stroke-width="1"/>
  <text x="234" y="600" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="11" fill="#52514e">2024</text>
  <text x="234" y="618" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12" font-weight="600" fill="#0b0b0b">pilots, knowledge bases</text>
  <line x1="412" y1="606" x2="426" y2="606" stroke="#52514e" stroke-width="1.5" marker-end="url(#arr)"/>
  <rect x="430" y="584" width="210" height="44" rx="8" fill="#ffffff" stroke="#c3c2b7" stroke-width="1"/>
  <text x="442" y="600" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="11" fill="#52514e">2025–now</text>
  <text x="442" y="618" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12" font-weight="600" fill="#0b0b0b">agents built by hand</text>
  <line x1="640" y1="606" x2="654" y2="606" stroke="#52514e" stroke-width="1.5" marker-end="url(#arr)"/>
  <rect x="660" y="584" width="252" height="58" rx="8" fill="#2a78d6" fill-opacity="0.10" stroke="#2a78d6" stroke-width="1.5"/>
  <text x="672" y="600" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="11" fill="#52514e">next year</text>
  <text x="672" y="616" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12" font-weight="600" fill="#0b0b0b">the "age of scale" — many agents,</text>
  <text x="672" y="631" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="11" fill="#52514e">one solidified foundation</text>

  <text x="48" y="664" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="11" fill="#52514e">Source: Belinda Neal and Keon Shahab (Anthropic), "Anthropic: Accelerating frontier AI in Financial Services.",</text>
  <text x="48" y="680" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="11" fill="#52514e">AI Engineer NYC 2026, day 1.</text>
</svg>
