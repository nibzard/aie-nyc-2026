<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 720" role="img" aria-labelledby="title desc" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
  <title id="title">Authorize per tool call, not per agent</title>
  <desc id="desc">A sequence diagram with four lanes: user, sandboxed agent runtime with a supervisor separate from the worker, token exchange security token service, and tool or MCP server. The user sends a mission of goal, allowed actions, and limits; the runtime exchanges the subject token for an ephemeral per-tool-call token that expires within minutes and is never stored; the user subject is kept down the chain. A contrast panel shows the replaced failure mode: an agent holding a long-lived OAuth token, drawn as a blocked dashed path.</desc>
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7.5" markerHeight="7.5" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#52514e"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="960" height="720" rx="12" fill="#fcfcfb" stroke="rgba(11,11,11,0.10)" stroke-width="1"/>

  <!-- Header -->
  <text x="40" y="58" font-size="11" letter-spacing="0.08em" fill="#52514e">CONCEPT — AUTH</text>
  <text x="40" y="86" font-size="20" font-weight="600" fill="#0b0b0b">Authorize per tool call, not per agent</text>
  <text x="40" y="112" font-size="13" fill="#52514e">&#8220;Runtime auth is the practice of authorizing an agent per tool call, rather than having the</text>
  <text x="40" y="130" font-size="13" fill="#52514e">agent hold broad standing access that it will eventually misuse.&#8221; — Allie Howe</text>

  <!-- Contrast panel: the failure mode this replaces -->
  <rect x="40" y="146" width="880" height="96" rx="8" fill="#ffffff" stroke="#c3c2b7" stroke-width="1"/>
  <text x="56" y="168" font-size="11" letter-spacing="0.08em" fill="#52514e">THE FAILURE MODE THIS REPLACES</text>
  <rect x="60" y="180" width="220" height="48" rx="8" fill="#fcfcfb" stroke="#c3c2b7" stroke-width="1"/>
  <text x="170" y="200" font-size="12.5" font-weight="600" fill="#0b0b0b" text-anchor="middle">Agent</text>
  <text x="170" y="217" font-size="11" fill="#52514e" text-anchor="middle">holds long-lived OAuth token</text>
  <line x1="284" y1="204" x2="420" y2="204" stroke="#52514e" stroke-width="1.5" stroke-dasharray="6 5" marker-end="url(#ah)"/>
  <text x="352" y="224" font-size="11" fill="#52514e" text-anchor="middle">removed</text>
  <rect x="428" y="180" width="110" height="48" rx="8" fill="#fcfcfb" stroke="#c3c2b7" stroke-width="1"/>
  <text x="483" y="209" font-size="12.5" font-weight="600" fill="#0b0b0b" text-anchor="middle">Tool</text>
  <text x="560" y="180" font-size="11" fill="#52514e">A chat agent gave up a long-lived OAuth token;</text>
  <text x="560" y="196" font-size="11" fill="#52514e">CRM data of 700-plus companies exported (day 2).</text>
  <text x="560" y="212" font-size="11" fill="#52514e">People &#8220;grabbed&#8221; OAuth for agents, but it was</text>
  <text x="560" y="228" font-size="11" fill="#52514e">built for website-to-website delegation (day 1).</text>

  <!-- Lane headers -->
  <rect x="50" y="262" width="140" height="40" rx="8" fill="#ffffff" stroke="#c3c2b7" stroke-width="1"/>
  <text x="120" y="287" font-size="12.5" font-weight="600" fill="#0b0b0b" text-anchor="middle">User</text>
  <rect x="219" y="262" width="222" height="58" rx="8" fill="#ffffff" stroke="#c3c2b7" stroke-width="1"/>
  <text x="330" y="282" font-size="12.5" font-weight="600" fill="#0b0b0b" text-anchor="middle">Agent runtime</text>
  <text x="330" y="298" font-size="11" fill="#52514e" text-anchor="middle">sandboxed</text>
  <text x="330" y="313" font-size="11" fill="#52514e" text-anchor="middle">supervisor separate from worker</text>
  <rect x="485" y="262" width="170" height="40" rx="8" fill="#2a78d6" fill-opacity="0.10" stroke="#2a78d6" stroke-width="1.25"/>
  <text x="570" y="287" font-size="12.5" font-weight="600" fill="#0b0b0b" text-anchor="middle">Token exchange / STS</text>
  <rect x="730" y="262" width="150" height="40" rx="8" fill="#ffffff" stroke="#c3c2b7" stroke-width="1"/>
  <text x="805" y="287" font-size="12.5" font-weight="600" fill="#0b0b0b" text-anchor="middle">Tool (MCP server)</text>

  <!-- Lifelines -->
  <line x1="120" y1="302" x2="120" y2="585" stroke="#e1e0d9" stroke-width="1"/>
  <line x1="330" y1="320" x2="330" y2="585" stroke="#e1e0d9" stroke-width="1"/>
  <line x1="570" y1="302" x2="570" y2="585" stroke="#e1e0d9" stroke-width="1"/>
  <line x1="805" y1="302" x2="805" y2="585" stroke="#e1e0d9" stroke-width="1"/>

  <!-- Messages -->
  <text x="224" y="344" font-size="12" fill="#0b0b0b" text-anchor="middle">mission: goal + allowed actions + limits</text>
  <line x1="122" y1="352" x2="326" y2="352" stroke="#52514e" stroke-width="1.75" marker-end="url(#ah)"/>

  <text x="450" y="396" font-size="12" fill="#0b0b0b" text-anchor="middle">token exchange: subject token + workload identity</text>
  <line x1="334" y1="404" x2="566" y2="404" stroke="#52514e" stroke-width="1.75" marker-end="url(#ah)"/>

  <text x="450" y="432" font-size="12" fill="#0b0b0b" text-anchor="middle">ephemeral token for this one tool call</text>
  <text x="450" y="450" font-size="11.5" fill="#52514e" text-anchor="middle">expires within minutes &#183; never stored</text>
  <line x1="566" y1="464" x2="334" y2="464" stroke="#52514e" stroke-width="1.75" marker-end="url(#ah)"/>

  <text x="566" y="500" font-size="12" fill="#0b0b0b" text-anchor="middle">tool call + per-call token</text>
  <text x="566" y="518" font-size="11.5" fill="#52514e" text-anchor="middle">user subject kept down the chain</text>
  <line x1="334" y1="532" x2="798" y2="532" stroke="#52514e" stroke-width="1.75" marker-end="url(#ah)"/>

  <text x="566" y="560" font-size="11" fill="#52514e" text-anchor="middle">result</text>
  <line x1="798" y1="568" x2="334" y2="568" stroke="#52514e" stroke-width="1.25" marker-end="url(#ah)"/>

  <!-- Bottom guards -->
  <rect x="200" y="600" width="264" height="46" rx="8" fill="#ffffff" stroke="#c3c2b7" stroke-width="1"/>
  <text x="332" y="619" font-size="12" fill="#0b0b0b" text-anchor="middle">Audit log — tamper-proof,</text>
  <text x="332" y="636" font-size="12" fill="#0b0b0b" text-anchor="middle">outside the agent&#8217;s control</text>
  <rect x="496" y="600" width="264" height="46" rx="8" fill="#ffffff" stroke="#c3c2b7" stroke-width="1"/>
  <text x="628" y="619" font-size="12" fill="#0b0b0b" text-anchor="middle">Time limit + resource budget,</text>
  <text x="628" y="636" font-size="12" fill="#0b0b0b" text-anchor="middle">with continual feedback</text>

  <!-- Source line -->
  <text x="40" y="688" font-size="11" fill="#52514e">Sources: Kim Maida (Keycard), day 1; &#8220;Intent Based Auth&#8221; panel, day 1; Andrey Rybka (Bloomberg), day 2. AI Engineer NYC 2026.</text>
</svg>
