<svg xmlns="http://www.w3.org/2000/svg" class="loop-svg learning-loop-wide" viewBox="0 0 1100 600" role="group" aria-labelledby="loop-title-download loop-desc-download"><title id="loop-title-download">From model output to useful work</title><desc id="loop-desc-download">A real task moves through relevant context, an agent with tools, and verification to an accepted, useful result. Permissions, isolation, and policy constrain execution. Failures and corrections improve context, skills, and evaluations for the next run. Measure cost per accepted result, latency, and human review time. Each stage links to a field guide.</desc><defs><pattern id="loop-grid-download" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#7186ce" stroke-opacity=".12"/></pattern><marker id="loop-arrow-download" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto-start-reverse"><path d="M1 1L6 4L1 7" fill="none" stroke="#92a5ee" stroke-width="1.5"/></marker><marker id="loop-return-download" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M1 1L6 4L1 7" fill="none" stroke="#6de2e1" stroke-width="1.5"/></marker></defs><style>.learning-loop-wide text{font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif}.learning-loop-wide a{text-decoration:none}.learning-loop-wide a:hover .node,.learning-loop-wide a:focus .node{stroke:#b9c8ff;stroke-width:3;fill:#202e57}.learning-loop-wide a:focus{outline:none}.learning-loop-wide a:focus-visible{outline:2px solid #b9c8ff;outline-offset:4px}.learning-loop-wide .line{fill:none;stroke:#92a5ee;stroke-width:2;marker-end:url(#loop-arrow-download)}.learning-loop-wide .return{fill:none;stroke:#6de2e1;stroke-width:2;marker-end:url(#loop-return-download)}.learning-loop-wide .node{fill:#131e3d;stroke:#5366ad;stroke-width:1.2}.learning-loop-wide .title{fill:#f0f4ff;font-size:18px;font-weight:650}.learning-loop-wide .small{fill:#b8c7eb;font-size:14px}.learning-loop-wide .number{fill:#9cadff;font-size:12px;letter-spacing:2px;font-weight:650}.learning-loop-wide .feedback{fill:#6de2e1}.learning-loop-wide .outcome{fill:#c5f7bf}</style><rect width="1100" height="600" rx="16" fill="#0b1229"/><rect width="1100" height="600" rx="16" fill="url(#loop-grid-download)"/>
